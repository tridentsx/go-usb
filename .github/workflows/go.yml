name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Native jobs on Linux and macOS. CGO_ENABLED is no longer a matrix
  # dimension: every backend (Linux, macOS via purego, Windows) is cgo-free
  # (see #14), so CGO_ENABLED=1 and =0 build the identical set of files on
  # every platform. Left explicit at 0 anyway, so a reintroduced `import "C"`
  # fails the build here rather than silently starting to require a C
  # toolchain again.
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    env:
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

  # Every backend is pure Go (macOS via purego's dlopen/dlsym, matching
  # Windows' lazy DLL loading), so all three cross-compile and type-check
  # from one Linux runner without needing a machine for every OS in the
  # matrix -- macOS included, which needed a real Mac before #14.
  cross-compile:
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: windows
          goarch: amd64
        - goos: windows
          goarch: arm64
        - goos: darwin
          goarch: amd64
        - goos: darwin
          goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    # Tests cannot run on a foreign GOOS, but compiling them still catches
    # signature drift between the platform backends and the shared tests.
    - name: Compile tests
      run: go test -c -o /dev/null .
