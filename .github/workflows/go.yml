name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Native jobs, run both with and without CGO.
  #
  # macOS has two backends: the IOKit one requires CGO, and the purego one is
  # selected when CGO is disabled. Both must build and pass, so CGO_ENABLED is a
  # matrix dimension rather than left at its default. Running Linux both ways
  # also confirms its backend stays free of CGO.
  native:
    name: ${{ matrix.os }} cgo=${{ matrix.cgo }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        cgo: [ '1', '0' ]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

  # The Windows backend is pure Go (golang.org/x/sys/windows lazy DLL loading),
  # so it cross-compiles without CGO and does not need a Windows runner to be
  # type-checked.
  cross-compile:
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: windows
          goarch: amd64
        - goos: windows
          goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    # Tests cannot run on a foreign GOOS, but compiling them still catches
    # signature drift between the platform backends and the shared tests.
    - name: Compile tests
      run: go test -c -o /dev/null .
